
name: Publikacja kalkulatora React

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v7

      - name: Zainstaluj Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Zainstaluj biblioteki
        run: npm ci

      - name: Zbuduj kalkulator
        run: npm run build
      - name: Uruchom testy kalkulatora
        run: npm run test

      - name: Sprawdz kod
        run: npm run lint

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v6

      - name: Przeslij pliki strony
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Opublikuj strone
        id: deployment
        uses: actions/deploy-pages@v5
      

