
name: Publikacja kalkulatora React

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v7

      - name: Zainstaluj Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Zainstaluj biblioteki
        run: npm ci

      - name: Zbuduj kalkulator
        run: npm run build
      - name: Uruchom testy kalkulatora
        run: npm run test

      - name: Sprawdz kod
        run: npm run lint

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v6

      - name: Przeslij pliki strony
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Opublikuj strone
        id: deployment
        uses: actions/deploy-pages@v5
      
name: iOS Build - Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React for iOS
        env:
          IOS_NATIVE_BUILD: "1"
        run: npm run build

      - name: Generate iOS project
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Compile unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p output/Payload
          cp -R \
            ios-derived/Build/Products/Release-iphoneos/App.app \
            output/Payload/

          cd output
          zip -qry ../Kalkulator-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-iOS
          path: Kalkulator-unsigned.ipa

